<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
</head>
<body>
<h1>Login Form</h1>

<form name="login-form" method="post">
    <p>Username: <input id="username" name="username" type="text" required minlength="3"></p>
    <p>Password: <input id="password" name="password" type="password" required minlength="8"></p>
    <p>Remember me <input id="remember" name="remember" value="remember" type="checkbox"></p>
    <p><input type="submit" value="Log in"></p>
</form>

<script>
    let usernameTextbox = document.getElementById("username"); //Creates a reference to the element
    let passwordTextbox = document.getElementById("password");
    let rememberTextbox = document.getElementById("remember");

    let username = usernameTextbox.value;
    let password = passwordTextbox.value;
    let remember = rememberTextbox.value;
</script>

</body>
</html>
