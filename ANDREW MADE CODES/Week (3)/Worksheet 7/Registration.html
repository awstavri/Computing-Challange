<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
    <link rel="stylesheet" href="../ExtraFun.css">
</head>
<body>
<h1>Registration Page</h1>

<form name="registration_form" id="registration_form" onsubmit="onSubmit(); return false;" method="post">
    <p name="subheading">- First Name: -</p>
    <p><input id="firstname" type="text" maxlength="20" minlength="2" required></p>

    <p name="subheading">- Last Name: -</p>
    <p><input id="lastname" type="text" maxlength="30" minlength="2" required></p>

    <p name="subheading">- Student ID: -</p>
    <p><input id="id" type="number" step="1" min="20000000" max="30000000" required></p>

    <p name="subheading">- Email Address: -</p>
    <p><input id="email" type="email" required></p>

    <p name="subheading">-  Height in Meters: -</p>
    <p>(Optional)</p>
    <p><input id="height" type="number" step="0.01"></p>

    <p><input id="submit" type="submit"></p>
</form>

<script>
    // 2. Create the function
    function onSubmit() {
        // Get values and make them lowercase
        let firstname = document.getElementById("firstname").value.toLowerCase();
        let lastname = document.getElementById("lastname").value.toLowerCase();

        // 3. Check if the password includes the username
        if (lastname.includes(firstname)) {
            alert("Please enter a valid last name.");
        } else {
            alert("OK");
        }
    }
</script>

<!--
In your form, create add following input elements:

o First name (text, required)
o Last name (text, required)
o Student ID (number, required)
o Email address (email, required)
o Height in meters (number, optional)
o A submit button.
-->

</body>
</html>
