<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript objects</title>
</head>
<body>

  <script>
      let person = {
          firstname: "John",
          lastname: "Smith",
          age: 30,
          isStudent: true,
          id: 123456789,
          printFullName: function () {
              console.log(person.firstname + " " + person.lastname);
          }
      };
  </script>

  <script>
      person.firstname = "Will";

      console.log(typeof person);

      let personID = person.id;

      person.printFullName()
  </script>





</body>
</html>
