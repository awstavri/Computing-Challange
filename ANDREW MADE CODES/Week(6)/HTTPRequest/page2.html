<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page 2</title>
</head>
<body>

<h1>Page 2</h1>

<!-- Empty paragraphs to display the numbers and the sum -->
<p id="num1"></p>
<p id="num2"></p>
<p id="sum"></p>

<script>
    // Step 1: Get the search string from the URL (e.g., ?num1=50&num2=10)
    const params = new URLSearchParams(location.search);

    // Step 2: Check if both parameters exist in the URL
    let num1Exists = params.has("num1");
    let num2Exists = params.has("num2");

    // Step 3: If they both exist, do the math
    if (num1Exists && num2Exists) {

        // Get the string values from the URL
        let strNum1 = params.get("num1");
        let strNum2 = params.get("num2");

        // Convert the strings into actual numbers
        let actualNum1 = Number(strNum1);
        let actualNum2 = Number(strNum2);

        // Add them together
        let totalSum = actualNum1 + actualNum2;

        // Get references to the HTML paragraphs
        let displayNum1 = document.getElementById("num1");
        let displayNum2 = document.getElementById("num2");
        let displaySum = document.getElementById("sum");

        // Display the values on the screen
        displayNum1.innerHTML = actualNum1;
        displayNum2.innerHTML = actualNum2;
        displaySum.innerHTML = "Sum: " + totalSum;

    } else {
        // If one or both are missing, show an alert
        alert("Both parameters need to be provided");
    }
</script>

</body>
</html>
