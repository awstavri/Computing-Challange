<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lists & Tables in HTML</title>
</head>
<body>
  <h1>My Task</h1>

  <ul>
    <li>Grocery shopping
      <ol type="A">
        <li>Buy Milk</li>
        <li>Buy bread</li>
      </ol>
    </li>
    <li>Fix the fridge</li>
    <li>Call my friends
      <ol>
        <li>Call John</li>
        <li>Call Mary</li>
      </ol>
    </li>
    <li>Pick up the laundry</li>
  </ul>

  <p><a href="Index.html">Go back to index</a></p>
</body>
</html>
